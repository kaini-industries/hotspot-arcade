name: build

permissions:
  contents: read

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  flipper-app:
    name: Build Flipper app (fap)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ufbt
        run: pip install --upgrade ufbt
      - name: Fetch Momentum SDK
        run: ufbt update --index-url=https://up.momentum-fw.dev/firmware/directory.json --channel=release --hw-target=f7
      - name: Build fap
        working-directory: flipper/hotspot-arcade
        run: ufbt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hotspot-arcade-fap
          path: flipper/hotspot-arcade/dist/hotspot_arcade.fap

  web-bundle:
    name: Build web bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - name: Install web deps
        working-directory: web
        # Zero runtime deps (Node stdlib only); install only if a lockfile exists.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi
      - name: Build web bundle
        working-directory: web
        run: |
          npm test
          node build.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hotspot-arcade-web
          path: |
            web/dist/*.gz
            web/dist/manifest.json

  esp32-firmware:
    name: Build ESP32 firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install arduino-cli
        run: |
          archive="$RUNNER_TEMP/arduino-cli.tar.gz"
          bindir="$RUNNER_TEMP/arduino-cli-bin"
          curl --proto '=https' --tlsv1.2 -fsSLo "$archive" \
            https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Linux_64bit.tar.gz
          echo "28a8e119c498a25607821c36cb2dc49e8463941b261a0d99091baa7bc692dd2b  $archive" | sha256sum -c -
          mkdir -p "$bindir"
          tar -xzf "$archive" -C "$bindir" arduino-cli
          echo "$bindir" >> "$GITHUB_PATH"
      - name: Install esp32 cores
        # All firmware variants share one reviewed core and package-index checksum set.
        run: |
          arduino-cli config init --overwrite
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.11
      - name: Compile firmware (all boards)
        # Same sketch, one build per supported board. AsyncTCP + ESPAsyncWebServer are
        # vendored in esp32/libs/. Output goes to build/<board>/ to match the fap's
        # assets/firmware/<board>/ layout that the on-device board picker flashes from.
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s2:PartitionScheme=huge_app \
            --libraries esp32/libs \
            --output-dir esp32/hotspot-arcade-fw/build/official_devboard \
            esp32/hotspot-arcade-fw
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --libraries esp32/libs \
            --output-dir esp32/hotspot-arcade-fw/build/wroom \
            esp32/hotspot-arcade-fw
          # CDCOnBoot stays disabled so Serial is UART0 — the pins the Flipper uses.
          arduino-cli compile \
            --fqbn esp32:esp32:esp32c5:PartitionScheme=huge_app,CDCOnBoot=default \
            --libraries esp32/libs \
            --output-dir esp32/hotspot-arcade-fw/build/c5 \
            esp32/hotspot-arcade-fw
      - name: Rename images to their flashed names
        # The Flipper shows the filename while flashing and the arduino names are far
        # wider than the screen, so the artifacts carry the same short names the app
        # flashes (see each board's flash_*.txt).
        run: |
          set -eu
          for dir in esp32/hotspot-arcade-fw/build/*/; do
            board="$(basename "$dir")"
            case "$board" in official_devboard) tag=s2 ;; *) tag="$board" ;; esac
            mv "$dir/hotspot-arcade-fw.ino.bootloader.bin" "$dir/ha-boot-$tag.bin"
            mv "$dir/hotspot-arcade-fw.ino.partitions.bin" "$dir/ha-part-$tag.bin"
            mv "$dir/hotspot-arcade-fw.ino.bin"            "$dir/ha-fw-$tag.bin"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hotspot-arcade-firmware
          path: esp32/hotspot-arcade-fw/build/*/*.bin

  bundled-assets:
    # The fap ships the web bundle, trivia packs, and ESP firmware images as committed
    # build outputs (the app catalog builds flipper/hotspot-arcade/ alone and never runs
    # tools/build-fap.sh, so anything untracked is missing from the catalog's fap).
    # Nothing else notices when they go stale, and a stale bundle ships a broken app:
    # v0.2.0 released a fap with no firmware in it, and a later commit left v6 images in
    # a fap that required v7. This job is that missing alarm.
    name: Bundled assets are current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"

      - name: Web bundle matches assets/web
        # Compare the DECOMPRESSED bundle: zlib emits different bytes across platforms
        # and versions for identical input, so the .gz files themselves don't match
        # between a dev machine and this runner even when the content is the same.
        run: |
          cd web && node build.mjs && cd ..
          if ! cmp -s <(gunzip -c web/dist/index.html.gz) \
                      <(gunzip -c flipper/hotspot-arcade/assets/web/index.html.gz); then
            echo "::error::flipper/hotspot-arcade/assets/web/index.html.gz is stale. Run tools/build-fap.sh and commit the result."
            exit 1
          fi
          if ! cmp -s web/dist/manifest.json flipper/hotspot-arcade/assets/web/manifest.json; then
            echo "::error::flipper/hotspot-arcade/assets/web/manifest.json is stale. Run tools/build-fap.sh and commit the result."
            exit 1
          fi

      - name: Content packs match assets/packs
        run: |
          for pack in packs/*/*.txt; do
            bundled="flipper/hotspot-arcade/assets/packs/${pack#packs/}"
            if ! cmp -s "$pack" "$bundled"; then
              echo "::error::$bundled is stale or missing. Run tools/build-fap.sh and commit the result."
              exit 1
            fi
          done
          source_count="$(find packs -mindepth 2 -maxdepth 2 -type f -name '*.txt' | wc -l)"
          bundled_count="$(find flipper/hotspot-arcade/assets/packs -mindepth 2 -maxdepth 2 -type f -name '*.txt' | wc -l)"
          if [ "$source_count" != "$bundled_count" ]; then
            echo "::error::assets/packs has packs that packs/ doesn't. Run tools/build-fap.sh and commit the result."
            exit 1
          fi

      - name: ESP firmware images were built from the current sources
        # The images can't be diffed (ESP-IDF embeds a build timestamp), so compare a
        # hash of the sources that produced them. See tools/asset-stamp.sh.
        run: |
          recorded=$(cat flipper/hotspot-arcade/.bundled-fw.sha256 2>/dev/null || echo missing)
          current=$(tools/asset-stamp.sh)
          if [ "$recorded" != "$current" ]; then
            echo "::error::The ESP sources changed but flipper/hotspot-arcade/assets/firmware/ wasn't rebuilt (recorded $recorded, current $current). Run tools/build-fap.sh and commit the refreshed images."
            exit 1
          fi

  simulator:
    name: Simulator headless suite (Emscripten 6.0.2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: mymindstorm/setup-emsdk@6ab9eb1bda2574c4ddb79809fc9247783eaf9021 # v14
        with:
          version: 6.0.2
          actions-cache-folder: emsdk-cache

      - name: Build and test the real engine
        run: |
          sim/engine/build.sh
          sim/test/all.sh

      - name: Run ASan and UBSan suite
        run: |
          sim/engine/build.sh --asan
          sim/test/all.sh
